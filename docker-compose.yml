  ewm-request:
    build: core/request-service
    image: request-service
    container_name: ewm-request
    networks:
      - ewm-net
    depends_on:
      main-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka
      - DB_URL=jdbc:postgresql://main-db:5432/ewm_request
    healthcheck:
      test: >
        sh -c '
          PORT_APP=$$(curl -s -H "Accept: application/json" --fail http://discovery-server:8761/eureka/apps/request-service |
