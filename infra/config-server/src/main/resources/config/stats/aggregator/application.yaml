aggregator:
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      attempt-timeout: 1000
      properties:
        "group.id": "aggregator-group"
        "client.id": "consumer-1"
        "key.deserializer": "org.apache.kafka.common.serialization.LongDeserializer"
        "value.deserializer": "ru.yandex.practicum.deserializer.UserActionDeserializer"
        "enable.auto.commit": "false"
      topic:
        name: "stats.user-actions.v1"
    producer:
      properties:
        "client.id": "producer-2"
        "key.serializer": "org.apache.kafka.common.serialization.LongSerializer"
        "value.serializer": "ru.yandex.practicum.serializer.AvroSerializer"
      topic:
        name: "stats.events-similarity.v1"

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  output:
    ansi:
      enabled: ALWAYS