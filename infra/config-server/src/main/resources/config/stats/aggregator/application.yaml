aggregator:
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}

    consumer:
      group-id: "aggregator-group"
      client-id: "consumer-1"
      key-deserializer: "org.apache.kafka.common.serialization.LongSerializer"
      value-deserializer: "ru.yandex.practicum.deserializer.UserActionDeserializer"
      attempt-timeout: 1000
      enable-auto-commit: "false"

    producer:
      client-id: "producer-2"
      key-serializer: "org.apache.kafka.common.serialization.LongSerializer"
      value-serializer: "ru.yandex.practicum.serializer.AvroSerializer"

    user-action-topic: "stats.user-actions.v1"
    events-similarity-topic: "stats.events-similarity.v1"

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  output:
    ansi:
      enabled: ALWAYS